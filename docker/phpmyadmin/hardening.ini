expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
zend.exception_ignore_args = On

allow_url_fopen = Off
allow_url_include = Off
cgi.fix_pathinfo = 0

open_basedir = /var/www/html/:/tmp/:/run/secrets/
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,posix_kill,posix_setuid,dl,show_source,highlight_file

; Import SQL : ajustez, ou mettez file_uploads = Off si inutile
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 256M

session.save_path = /tmp
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.sid_length = 48
