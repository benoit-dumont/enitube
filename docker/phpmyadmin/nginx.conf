limit_req_zone $binary_remote_addr zone=pma_login:10m rate=30r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /var/www/html;
    index index.php;
    client_max_body_size 64m;

    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "no-referrer" always;
    add_header Permissions-Policy         "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP : envoyée par phpMyAdmin lui-même. HSTS : à ajouter sur le reverse proxy TLS.

    # Fichiers et dossiers qui n'ont rien à faire sur le web
    location ~ /\. { deny all; }
    location ~* ^/(libraries|templates|vendor|locale|tmp|config\.inc\.php) { deny all; }
    location ~* \.(md|json|lock|txt|sql|dist|xml|yml|yaml|neon)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        limit_req zone=pma_login burst=20 nodelay;
        try_files $uri =404;
        fastcgi_pass phpmyadmin:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
    }
}
