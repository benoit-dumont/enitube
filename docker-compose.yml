# ENITub : services de développement local (MySQL + phpMyAdmin + Mailpit)
# Usage : docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: enitube-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_BDD:-enitube}
      MYSQL_USER: ${MYSQL_USER:-enitube}
      MYSQL_PASSWORD: ${MYSQL_PASS:-enitube}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Crée la base de test (<MYSQL_BDD>_test) au premier démarrage
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # phpMyAdmin (PHP-FPM) : interface via phpmyadmin-web
  phpmyadmin:
    build:
      context: ./docker/phpmyadmin
      target: php
    container_name: enitube-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,uid=82,gid=82,size=128m
    secrets: [pma_blowfish]

  # nginx : http://localhost:8080
  phpmyadmin-web:
    build:
      context: ./docker/phpmyadmin
      target: web
    container_name: enitube-phpmyadmin-web
    restart: unless-stopped
    depends_on:
      - phpmyadmin
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:8080"

  # Serveur SMTP factice : capte les emails de réinitialisation de mot de passe
  mailpit:
    image: axllent/mailpit:latest
    container_name: enitube-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (SMTP_HOST=localhost, SMTP_PORT=1025)
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025" # Interface web : http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql_data:
secrets:
  pma_blowfish:
    file: ./docker/phpmyadmin/secrets/pma_blowfish
