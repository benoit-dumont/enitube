# ENITub : services de développement local (MySQL + Mailpit)
# Usage : docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: enitube-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_BDD:-enitube}
      MYSQL_USER: ${MYSQL_USER:-enitube}
      MYSQL_PASSWORD: ${MYSQL_PASS:-enitube}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3307"
    volumes:
      - mysql_data:/var/lib/mysql
      # Crée la base de test (<MYSQL_BDD>_test) au premier démarrage
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Serveur SMTP factice : capte les emails de réinitialisation de mot de passe
  mailpit:
    image: axllent/mailpit:latest
    container_name: enitube-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP (SMTP_HOST=localhost, SMTP_PORT=1025)
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025" # Interface web : http://localhost:8025
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql_data:
